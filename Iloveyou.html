
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AR Love Hologram</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  height: 100dvh;
  overflow: hidden;
  background: radial-gradient(circle, #160b40, #02020b 75%);
  font-family: Arial, sans-serif;
  color: white;
  touch-action: none;
}

canvas {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
}

#love {
  position: absolute;
  left: 50%;
  top: 45%;
  transform: translate(-50%, -50%);
  text-align: center;
  cursor: grab;
  user-select: none;
  touch-action: none;
  z-index: 2;
}

#heart {
  font-size: clamp(100px, 30vw, 180px);
  line-height: 1.1;
  filter: drop-shadow(0 0 18px #ff00dd);
  animation: pulse 1s infinite alternate;
}

h1 {
  margin: 0;
  font-size: clamp(32px, 9vw, 54px);
  color: #ff80fa;
  text-shadow: 0 0 8px #ff00dd,
               0 0 20px #a000ff,
               0 0 35px #00eaff;
  animation: glow 1.5s infinite alternate;
}

#hint {
  margin-top: 15px;
  font-size: 13px;
  color: #76faff;
  letter-spacing: 2px;
}

button {
  border: 1px solid #ff59ed;
  border-radius: 30px;
  padding: 13px 20px;
  color: white;
  background: #1c0c3c;
  box-shadow: 0 0 15px #9d00ff;
  font-size: 15px;
  cursor: pointer;
}

.controls {
  position: absolute;
  bottom: 7%;
  width: 100%;
  display: flex;
  justify-content: center;
  gap: 10px;
  z-index: 3;
}

@keyframes pulse {
  from { transform: scale(.95); }
  to { transform: scale(1.08); }
}

@keyframes glow {
  from { filter: hue-rotate(0deg); }
  to { filter: hue-rotate(45deg); }
}
</style>
</head>

<body>
<canvas id="fx"></canvas>

<div id="love">
  <div id="heart">💗</div>
  <h1>I LOVE YOU</h1>
  <div id="hint">TAP • GESER • CINTA</div>
</div>

<div class="controls">
  <button id="change">💖 TAP AKU</button>
  <button id="reset">↺ RESET</button>
</div>

<script>
const love = document.getElementById("love");
const heart = document.getElementById("heart");
const hint = document.getElementById("hint");
const canvas = document.getElementById("fx");
const ctx = canvas.getContext("2d");

let x = innerWidth / 2;
let y = innerHeight * 0.45;
let dragging = false;
let moved = false;
let offsetX = 0, offsetY = 0;
let hue = 0;
let particles = [];
let lastTap = 0;

function resize() {
  canvas.width = innerWidth * devicePixelRatio;
  canvas.height = innerHeight * devicePixelRatio;
  canvas.style.width = innerWidth + "px";
  canvas.style.height = innerHeight + "px";
  ctx.setTransform(devicePixelRatio, 0, 0,
                   devicePixelRatio, 0, 0);
}
addEventListener("resize", resize);
resize();

function place() {
  love.style.left = x + "px";
  love.style.top = y + "px";
}
place();

love.addEventListener("pointerdown", e => {
  dragging = true;
  moved = false;
  offsetX = e.clientX - x;
  offsetY = e.clientY - y;
  love.setPointerCapture(e.pointerId);
});

love.addEventListener("pointermove", e => {
  if (!dragging) return;
  if (Math.abs(e.clientX - x) +
      Math.abs(e.clientY - y) > 3) moved = true;
  x = e.clientX - offsetX;
  y = e.clientY - offsetY;
  x = Math.max(80, Math.min(innerWidth - 80, x));
  y = Math.max(130, Math.min(innerHeight - 130, y));
  place();
});

love.addEventListener("pointerup", () => {
  dragging = false;
  if (!moved) burst(x, y);
});

function burst(px, py) {
  for (let i = 0; i < 35; i++) {
    const a = Math.random() * Math.PI * 2;
    const speed = 1 + Math.random() * 5;
    particles.push({
      x: px, y: py,
      vx: Math.cos(a) * speed,
      vy: Math.sin(a) * speed,
      life: 1,
      size: 2 + Math.random() * 4
    });
  }
}

function animate() {
  requestAnimationFrame(animate);
  ctx.clearRect(0, 0, innerWidth, innerHeight);
  hue = (hue + 1) % 360;

  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.015;
    p.life -= 0.015;

    ctx.globalAlpha = Math.max(0, p.life);
    ctx.fillStyle = `hsl(${hue + i * 8},100%,65%)`;
    ctx.shadowBlur = 15;
    ctx.shadowColor = ctx.fillStyle;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();

    if (p.life <= 0) particles.splice(i, 1);
  }
  ctx.globalAlpha = 1;
  ctx.shadowBlur = 0;
}
animate();

document.getElementById("change").onclick = () => {
  const words = [
    "I LOVE YOU",
    "LOVE FOREVER",
    "♡ SAYANG KAMU ♡",
    "YOU ARE MY STAR"
  ];
  const now = Date.now();
  if (now - lastTap < 1500) {
    burst(x, y);
  }
  lastTap = now;
  const current = words.indexOf(
    love.querySelector("h1").textContent
  );
  love.querySelector("h1").textContent =
    words[(current + 1) % words.length];
  burst(x, y);
};

document.getElementById("reset").onclick = () => {
  x = innerWidth / 2;
  y = innerHeight * 0.45;
  love.querySelector("h1").textContent = "Happy birth day";
  place();
  burst(x, y);
};

love.addEventListener("dblclick", () => {
  heart.textContent = heart.textContent === "💗" ? "💖" : "💗";
  burst(x, y);
});
</script>
</body>
</html>
